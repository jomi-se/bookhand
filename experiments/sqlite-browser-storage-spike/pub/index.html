<!doctype html><meta charset=utf-8><title>bench</title>
<script type="module">
window.runBench = (kind,N,phase)=>new Promise((res,rej)=>{
  const w=new Worker('/worker.js',{type:'module'});
  w.onmessage=e=>{ w.terminate(); e.data.ok?res(e.data.res):rej(new Error(e.data.error)); };
  w.onerror=e=>{ rej(new Error('worker error: '+e.message)); };
  w.postMessage({kind,N,phase});
});
window.__ready=true;
</script>
<body>bench</body>
